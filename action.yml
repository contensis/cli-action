name: "Contensis cli action"
description: "A GitHub Action for interacting with a Contensis CMS via the cli"
author: "Zengenti"
branding:
  icon: "terminal"
  color: "blue"
inputs:
  alias:
    description: "The Contensis cloud alias to connect to"
    required: true
  project-id:
    description: "The id of the project to connect to"
    required: false
    default: website
  client-id:
    description: "Client id to connect to the supplied alias"
    required: true
  shared-secret:
    description: "Shared secret to use with the supplied client id"
    required: true
  command:
    description: "Optional: which cli command to run. Values containing spaces or newlines must be wrapped in quotes. The command is tokenised and never executed as shell syntax."
    required: false
  cli-version:
    description: "Optional: pull cli from specified tag. Default: release"
    default: release
  cli-splash:
    description: "Optional: show welcome splash screen. Default: true"
    default: true

outputs:
  command-output:
    description: "The cli command output"
    value: ${{ steps.set.outputs.command-output }}

runs:
  using: "composite"
  steps:
    - name: Touch output file
      id: pwd
      shell: bash
      run: |
        touch ./output.json
        echo "pwd=$(pwd)" >> $GITHUB_OUTPUT

    - name: Pull Contensis CLI docker image and run commands
      id: cli-command
      shell: bash
      env:
        CONTENSIS_ALIAS: ${{ inputs.alias }}
        CONTENSIS_PROJECT_ID: ${{ inputs.project-id }}
        CONTENSIS_CLIENT_ID: ${{ inputs.client-id }}
        CONTENSIS_SHARED_SECRET: ${{ inputs.shared-secret }}
        CONTENSIS_COMMAND: ${{ inputs.command || '--help' }}
        CONTENSIS_CLI_SPLASH: ${{ inputs.cli-splash }}
      run: |
        # The 'command' input is one string. We split it into separate arguments here - respecting "quotes", 
        # handing them to the contensis cli as real arguments. 
        # The string is never executed as shell code, so a value can never run extra commands or corrupt the argument list.

        # python3 shlex module does the splitting; applies standard shell quoting rules without executing anything.
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required on the runner to parse the 'command' input but was not found."
          exit 1
        fi

        # Split the command into arguments, writing them to a temp file separated by NUL bytes 
        # - NUL cannot occur inside an argument, so values containing spaces or newlines survive intact.
        # - On failure python prints the exact parse error (e.g. "No closing quotation") into the step log.
        ARGS_FILE="$(mktemp)"
        trap 'rm -f "$ARGS_FILE"' EXIT

        if ! printf '%s' "$CONTENSIS_COMMAND" \
          | python3 -c 'import shlex,sys; sys.stdout.write("\0".join(shlex.split(sys.stdin.read())))' \
          > "$ARGS_FILE"; then
          # Unbalanced quote or bad escape: stop here rather than run a broken or shifted command.
          echo "::error::The 'command' input is not valid shell-quoted text - see the parse error above. Check for unbalanced or unescaped quotes in the command (for example inside a commit message)."
          exit 1
        fi

        # Read the split arguments back into a bash array; there must be at least one (the command name).
        mapfile -d '' -t CMD_ARGS < "$ARGS_FILE"
        if [ "${#CMD_ARGS[@]}" -eq 0 ]; then
          echo "::error::The 'command' input is empty."
          exit 1
        fi

        # Environment for the container: pass each CONTENSIS_*/GITHUB_*/CI/HOME variable by NAME (-e NAME) 
        # so docker copies its current value exactly, newlines and all.
        ENV_ARGS=()
        while IFS= read -r line; do
          ENV_ARGS+=("-e" "${line%%=*}")
        done < <(printenv | grep -E '^(CONTENSIS_|GITHUB_|CI=|HOME=)')

        # Run the cli image: optional splash, connect, print version, then run the caller's command with the output captured to output.json.
        # Inside the container script, "$@" is exactly the argument list prepared above - it is passed straight to contensis with no further parsing.
        # TODO: replace :latest with :${{ inputs.cli-version }}!!
        docker run --rm \
          "${ENV_ARGS[@]}" \
          -v ${{ steps.pwd.outputs.pwd }}/output.json:/usr/src/app/output.json \
          ghcr.io/contensis/cli/main/app:latest \
          sh -c '
            [ "$CONTENSIS_CLI_SPLASH" = "true" ] && contensis;
            contensis connect "$CONTENSIS_ALIAS" -id "$CONTENSIS_CLIENT_ID" -s "$CONTENSIS_SHARED_SECRET" -p "$CONTENSIS_PROJECT_ID";
            contensis get version;
            contensis "$@" --output output.json
          ' _ "${CMD_ARGS[@]}"

    - name: Set output variables
      id: set
      shell: bash
      run: |
        {
          echo 'command-output<<EOF'
          cat output.json
          echo ""
          echo 'EOF'
        } >> $GITHUB_OUTPUT
